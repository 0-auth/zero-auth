services:
  app:
    build:
      context: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: development
      PORT: "3001"
      PUBLIC_ORIGIN: http://localhost:3001
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: zero_auth_idp_example
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD to at least 12 characters}
    depends_on:
      mongodb:
        condition: service_healthy
  mongodb:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mongo-data:
