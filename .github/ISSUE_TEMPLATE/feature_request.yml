name: "💡 Feature Request"
description: "Suggest an idea or improvement for @0-auth/zero-auth"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make `@0-auth/zero-auth` better? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a specific problem or friction point?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature or API working.
      placeholder: |
        ```ts
        // Example API usage
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?
    validations:
      required: false
