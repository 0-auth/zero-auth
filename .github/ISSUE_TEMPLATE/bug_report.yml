name: "🐛 Bug Report"
description: "File a report to help us fix a bug in @0-auth/zero-auth"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Please note: If you are reporting a **security vulnerability**, please see [SECURITY.md](https://github.com/0-auth/zero-auth/blob/master/SECURITY.md) instead of opening a public issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps & Code
      description: Provide a minimal code snippet or step-by-step instructions to reproduce the issue.
      placeholder: |
        ```ts
        import { createAuth } from "@0-auth/zero-auth";
        // ...
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: "Node.js version, Express version, @0-auth/zero-auth version, OS, etc."
      placeholder: "Node v20.10.0, Express v4.18.2, @0-auth/zero-auth v1.0.1, Linux"
    validations:
      required: true
