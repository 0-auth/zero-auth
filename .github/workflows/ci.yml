name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Build documentation
        run: npm run docs:build

      - name: Run tests with coverage threshold
        run: npm run test:coverage

  core-examples:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: |
            examples/express-rest-api/package-lock.json
            examples/express-cookies-redis/package-lock.json

      - name: Verify REST API example
        working-directory: examples/express-rest-api
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test

      - name: Verify cookie and Redis example
        working-directory: examples/express-cookies-redis
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
        env:
          REDIS_URL: redis://127.0.0.1:6379

  mongo-integration:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run MongoDB integration tests
        run: npm run test:integration --workspace @0-auth/zero-auth-idp-mongodb
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017

      - name: Build IdP and MongoDB adapter
        run: |
          npm run build --workspace @0-auth/zero-auth-idp
          npm run build --workspace @0-auth/zero-auth-idp-mongodb

      - name: Verify runnable MongoDB example
        working-directory: examples/express-idp
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017

      - name: Verify standalone IdP image
        env:
          DEMO_PASSWORD: ci-only-standalone-password
        run: |
          export OIDC_PRIVATE_KEY_BASE64="$(node -e 'const {generateKeyPairSync}=require("node:crypto");const {privateKey}=generateKeyPairSync("rsa",{modulusLength:2048});process.stdout.write(Buffer.from(privateKey.export({type:"pkcs8",format:"pem"})).toString("base64"))')"
          trap 'docker compose -p zero-auth-idp-ci -f examples/express-idp/docker-compose.yml down -v' EXIT
          docker compose -p zero-auth-idp-ci -f examples/express-idp/docker-compose.yml up --build -d --wait
          node --input-type=module -e "const [health, metadata, discovery, jwks, home, protectedApi] = await Promise.all(['/health', '/auth/.well-known/oauth-authorization-server', '/auth/.well-known/openid-configuration', '/auth/.well-known/jwks.json', '/', '/api/profile'].map(path => fetch('http://127.0.0.1:3001' + path))); if (!health.ok || !metadata.ok || !discovery.ok || !jwks.ok || !home.ok || protectedApi.status !== 401 || !(await home.text()).includes('Continue to identity provider')) throw new Error('Standalone image smoke test failed')"
          docker compose -p zero-auth-idp-ci -f examples/express-idp/docker-compose.yml stop mongodb
          node --input-type=module -e "const health = await fetch('http://127.0.0.1:3001/health', { signal: AbortSignal.timeout(10000) }); if (health.status !== 503) throw new Error('Readiness did not report the MongoDB outage')"
